<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1080px; height:1440px; position:relative; overflow:hidden;
  font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;
  background:linear-gradient(165deg,#FFF9F0 0%,#F7EDFF 48%,#EAE0FF 100%);
}
.blob { position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; }
.b1 { width:420px;height:420px; background:#D9C5FF; top:-140px; right:-120px; }
.b2 { width:380px;height:380px; background:#FFD9EC; bottom:-120px; left:-130px; }
.wrap { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; padding:56px 64px 44px; }
.chip {
  background:rgba(255,255,255,.85); border-radius:999px;
  padding:12px 26px; font-size:26px; font-weight:600; color:#6B54A8;
  box-shadow:0 6px 18px rgba(120,80,200,.12); letter-spacing:1px;
}
.chip-flash {
  background:linear-gradient(135deg,#FFF7D6,#FFEBB0); color:#8A6D1F;
  box-shadow:0 6px 18px rgba(200,150,40,.18);
}
.chips { align-self:flex-start; display:flex; gap:16px; }
.title { margin-top:44px; text-align:center; line-height:1.16; }
.title .big { font-size:96px; font-weight:900; color:#2B2438; letter-spacing:2px; }
.mark { background:linear-gradient(transparent 58%, #FFE38F 58%); padding:0 6px; border-radius:6px; }
.sub { margin-top:22px; font-size:34px; color:#7A6E92; font-weight:500; letter-spacing:3px; text-align:center;}
.stage { margin-top:52px; display:flex; gap:46px; }
.shot-card {
  background:rgba(255,255,255,.92); border-radius:28px; padding:22px 22px 16px;
  box-shadow:0 24px 50px rgba(100,65,180,.16);
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.shot-card.tilt-l { transform:rotate(-2.6deg); }
.shot-card.tilt-r { transform:rotate(2.6deg); }
.plate { background:#1B1B2B; border-radius:18px; padding:10px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
.plate img { display:block; width:396px; height:auto; image-rendering:auto; }
.cap { font-size:26px; font-weight:700; color:#4A3E68; }
.pills { margin-top:56px; display:flex; flex-wrap:wrap; justify-content:center; gap:20px; max-width:950px; }
.pill {
  background:rgba(255,255,255,.9); border:2px solid #EBDDFF; color:#574478;
  border-radius:999px; padding:16px 30px; font-size:29px; font-weight:600;
  box-shadow:0 8px 20px rgba(120,80,200,.08);
}
.footer { margin-top:auto; width:100%; display:flex; flex-direction:column; gap:18px; align-items:center; }
.tags { font-size:27px; color:#9A8DB8; font-weight:500; letter-spacing:.5px; }
.brand { display:flex; align-items:center; gap:14px; font-size:25px; color:#6B54A8; font-weight:600; }
.dot-row { display:flex; gap:10px; }
.dot { width:12px; height:12px; border-radius:50%; background:#C9B4F5; }
.dot.on { width:34px; border-radius:99px; background:#8A63F5; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <div class="chips">
    <div class="chip">🟣 GLM Coding Plan 玩家作品 · v0.2.0 开源免费</div>
    <div class="chip chip-flash">⚡ 全程由 GLM-5.3-Flash 调教</div>
  </div>

  <div class="title">
    <div class="big">给 <span class="mark">GLM 配额</span></div>
    <div class="big">做了个桌面小挂件🔥</div>
  </div>
  <div class="sub">实时看住 MCP 配额 · 5h Token 流控 · 重置倒计时</div>

  <div class="stage">
    <div class="shot-card tilt-l">
      <div class="plate"><img src="../../images/widget-dark.png" alt=""></div>
      <div class="cap">🌙 深色模式</div>
    </div>
    <div class="shot-card tilt-r">
      <div class="plate" style="background:#2A2A3C;"><img src="../../images/widget-light.png" alt=""></div>
      <div class="cap">☀️ 浅色模式</div>
    </div>
  </div>

  <div class="pills">
    <div class="pill">⏱ 重置倒计时</div>
    <div class="pill">📌 一键贴边吸附</div>
    <div class="pill">🔔 超额预警</div>
    <div class="pill">🌗 双主题跟随系统</div>
  </div>

  <div class="footer">
    <div class="tags">#AI编程 #智谱GLM #程序员工具 #效率神器 #开源项目</div>
    <div class="brand">GLM Quota Monitor <span class="dot-row"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></span> Windows 小工具</div>
  </div>
</div>
</body>
</html>
