<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLM Quota Monitor - Popup Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif;
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #e0e0e0;
  }

  .popup {
    width: 320px;
    background: #16213e;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    overflow: hidden;
    border: 1px solid #2a2a4a;
  }

  /* ---- Header ---- */
  .popup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px 10px;
    background: linear-gradient(135deg, #0f3460, #16213e);
  }
  .popup-header .left {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .popup-header .logo {
    width: 24px; height: 24px;
    background: linear-gradient(135deg, #00b4d8, #0077b6);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff;
  }
  .popup-header .title {
    font-size: 14px;
    font-weight: 600;
    color: #e0e0e0;
  }
  .popup-header .platform {
    font-size: 11px;
    color: #7b8cde;
    background: rgba(123,140,222,0.12);
    padding: 2px 8px;
    border-radius: 10px;
  }

  /* ---- Quota Rows ---- */
  .quota-section {
    padding: 6px 16px 8px;
  }
  .quota-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
  }
  .quota-row + .quota-row {
    border-top: 1px solid #1e2a4a;
  }
  .quota-label {
    font-size: 12px;
    color: #8892b0;
    min-width: 70px;
  }
  .quota-bar-wrap {
    flex: 1;
    margin: 0 12px;
    height: 8px;
    background: #1a1a3e;
    border-radius: 4px;
    overflow: hidden;
  }
  .quota-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.6s ease;
  }
  .bar-ok      { background: linear-gradient(90deg, #00b894, #00cec9); }
  .bar-warn    { background: linear-gradient(90deg, #fdcb6e, #e17055); }
  .bar-critical{ background: linear-gradient(90deg, #e17055, #d63031); }
  .quota-pct {
    font-size: 13px;
    font-weight: 600;
    min-width: 42px;
    text-align: right;
  }
  .pct-ok       { color: #00cec9; }
  .pct-warn     { color: #fdcb6e; }
  .pct-critical { color: #ff7675; }

  /* ---- Stats ---- */
  .stats-row {
    display: flex;
    justify-content: space-around;
    padding: 10px 16px 14px;
    border-top: 1px solid #1e2a4a;
  }
  .stat-item {
    text-align: center;
  }
  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: #e0e0e0;
  }
  .stat-unit {
    font-size: 11px;
    color: #7b8cde;
    margin-top: 2px;
  }

  /* ---- Footer ---- */
  .popup-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: rgba(0,0,0,0.15);
    border-top: 1px solid #1e2a4a;
  }
  .footer-time {
    font-size: 11px;
    color: #5a6a8a;
  }
  .footer-btn {
    font-size: 11px;
    color: #7b8cde;
    cursor: pointer;
    background: none;
    border: 1px solid #2a2a5a;
    border-radius: 6px;
    padding: 3px 10px;
    transition: all 0.2s;
  }
  .footer-btn:hover {
    background: #2a2a5a;
    color: #a0b0f0;
  }

  /* ---- Reset Countdown ---- */
  .reset-info {
    font-size: 11px;
    color: #5a6a8a;
    text-align: center;
    padding: 0 16px 10px;
  }
  .reset-info span { color: #7b8cde; }

  /* ---- Separator line ---- */
  .sep {
    height: 1px;
    background: #1e2a4a;
    margin: 0 16px;
  }

  /* ============================
     Variant: Warning State
     ============================ */
  .popup.warning .popup-header { background: linear-gradient(135deg, #4a1a1a, #2a1020); }
  .popup.warning .popup-header .logo { background: linear-gradient(135deg, #e17055, #d63031); }
</style>
</head>
<body>

<!-- ===== Normal State ===== -->
<div class="popup" id="normal">
  <div class="popup-header">
    <div class="left">
      <div class="logo">G</div>
      <div class="title">GLM 配额监控</div>
    </div>
    <div class="platform">智谱 AI</div>
  </div>

  <div class="quota-section">
    <div class="quota-row">
      <div class="quota-label">MCP 配额</div>
      <div class="quota-bar-wrap"><div class="quota-bar bar-ok" style="width: 35%"></div></div>
      <div class="quota-pct pct-ok">35%</div>
    </div>
    <div class="quota-row">
      <div class="quota-label">5h Token</div>
      <div class="quota-bar-wrap"><div class="quota-bar bar-ok" style="width: 22%"></div></div>
      <div class="quota-pct pct-ok">22%</div>
    </div>
  </div>

  <div class="sep"></div>

  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-value">802</div>
      <div class="stat-unit">调用次数</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">300M</div>
      <div class="stat-unit">Token 用量</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">47:22</div>
      <div class="stat-unit">配额重置</div>
    </div>
  </div>

  <div class="popup-footer">
    <div class="footer-time">🕐 上次刷新: 14:32:05</div>
    <button class="footer-btn">⟳ 立即刷新</button>
  </div>
</div>

<br><br>

<!-- ===== Warning State ===== -->
<div class="popup warning" id="warning">
  <div class="popup-header">
    <div class="left">
      <div class="logo">G</div>
      <div class="title">GLM 配额监控</div>
    </div>
    <div class="platform" style="color:#ff7675;background:rgba(255,118,117,0.12);">⚠ 配额预警</div>
  </div>

  <div class="quota-section">
    <div class="quota-row">
      <div class="quota-label">MCP 配额</div>
      <div class="quota-bar-wrap"><div class="quota-bar bar-critical" style="width: 87%"></div></div>
      <div class="quota-pct pct-critical">87%</div>
    </div>
    <div class="quota-row">
      <div class="quota-label">5h Token</div>
      <div class="quota-bar-wrap"><div class="quota-bar bar-warn" style="width: 63%"></div></div>
      <div class="quota-pct pct-warn">63%</div>
    </div>
  </div>

  <div class="sep"></div>

  <div class="stats-row">
    <div class="stat-item">
      <div class="stat-value">2,341</div>
      <div class="stat-unit">调用次数</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">1.2B</div>
      <div class="stat-unit">Token 用量</div>
    </div>
    <div class="stat-item">
      <div class="stat-value">03:15</div>
      <div class="stat-unit">配额重置</div>
    </div>
  </div>

  <div class="popup-footer">
    <div class="footer-time">🕐 上次刷新: 14:32:05</div>
    <button class="footer-btn">⟳ 立即刷新</button>
  </div>
</div>

</body>
</html>
