<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:1080px; height:1440px; position:relative; overflow:hidden;
  font-family:"Microsoft YaHei UI","PingFang SC",sans-serif;
  background:linear-gradient(160deg,#F4F0FF 0%,#EFE6FF 55%,#FFF4EA 100%);
}
.blob { position:absolute; border-radius:50%; filter:blur(80px); opacity:.5; }
.b1 { width:460px;height:460px; background:#D9C9FF; top:-150px; left:-150px; }
.b2 { width:400px;height:400px; background:#FFE2CB; bottom:-130px; right:-110px; }
.wrap { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; padding:60px 72px 44px; }
.kicker { display:flex; align-items:center; gap:14px; font-size:27px; color:#8577B3; font-weight:600; letter-spacing:2px;}
.kicker .bar { width:44px; height:8px; border-radius:99px; background:#B79BFF; }
.title { margin-top:16px; font-size:64px; font-weight:900; color:#2B2438; letter-spacing:1px;}
.title em { font-style:normal; color:#8A4BFF; }
.main { margin-top:44px; display:flex; gap:44px; align-items:flex-start; }
.window {
  flex-shrink:0; background:#FFFFFF; border-radius:24px; padding:12px;
  box-shadow:0 24px 52px rgba(105,70,190,.18); overflow:hidden;
}
.window img { display:block; width:486px; height:auto; border-radius:14px; }
.bullets { display:flex; flex-direction:column; gap:30px; padding-top:16px; }
.bl b { display:block; font-size:31px; color:#33294A; letter-spacing:.5px; }
.bl span { display:block; margin-top:8px; font-size:25px; color:#857A99; line-height:1.45; }
.open-source {
  margin-top:46px; background:#1E1E2E; border-radius:26px; padding:34px 40px;
  box-shadow:0 22px 46px rgba(50,35,90,.28);
  display:flex; align-items:center; justify-content:space-between; gap:20px;
}
.os-l b { display:block; font-size:33px; color:#F2F0FF; letter-spacing:1px; }
.os-l span { display:block; margin-top:10px; font-size:26px; color:#A79FE0; }
.os-r {
  text-align:center; background:linear-gradient(135deg,#8A63F5,#B47CFF); border-radius:18px;
  padding:18px 30px; color:#fff; font-weight:800; font-size:29px; white-space:nowrap;
  box-shadow:0 10px 26px rgba(138,99,245,.4);
}
.footer { margin-top:auto; display:flex; justify-content:space-between; align-items:flex-end; }
.tip { font-size:27px; color:#A79BC8; font-weight:500; }
.pageno { font-size:25px; color:#C3B5E8; font-weight:700; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <div class="kicker"><span class="bar"></span>设置面板 SETTINGS</div>
  <div class="title">深色模式讲究到<em>每一个控件</em> 🎨</div>

  <div class="main">
    <div class="window"><img src="../../images/settings-dark.png" alt=""></div>
    <div class="bullets">
      <div class="bl"><b>📋 分区排版</b><span>监控 / 外观与行为 / 预警阈值，一目了然</span></div>
      <div class="bl"><b>🌙 全控件适配</b><span>下拉框逐项自绘，拒绝系统白块乱入</span></div>
      <div class="bl"><b>⚙️ 阈值自定义</b><span>50% 变黄、80% 变红弹通知，全可调</span></div>
    </div>
  </div>

  <div class="open-source">
    <div class="os-l">
      <b>GitHub 开源 · MIT 协议</b>
      <span>github.com/mydelren/GLMQuotaMonitor</span>
      <span style="display:block;margin-top:8px;font-size:23px;color:#8F86C9;">⚡ UI · 文案 · 截图管线 —— 全由 GLM-5.3-Flash 完成</span>
    </div>
    <div class="os-r">⭐ 点个 Star</div>
  </div>

  <div class="footer">
    <div class="tip">💡 智谱 Z.ai / 官方 API 都支持自动识别</div>
    <div class="pageno">04 · END</div>
  </div>
</div>
</body>
</html>
